# サイトを build して GitHub Pages に出す。
# 起動: このリポジトリへの push / 手動 / パッケージの Release 後の repository_dispatch / 30 分ごと。
# build の中で scripts/build-listing.mjs が GitHub Release から VPM の一覧 (vpm/index.json) を作り直す。
#
# 30 分ごとの実行では、まず check ジョブが一覧だけを組み立てて公開中のものと見比べ、
# 中身が変わったときだけ build と deploy に進む。無駄なデプロイをしないための仕組み。
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [package-released]
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 公開中のデプロイを途中で止めない
  cancel-in-progress: false

jobs:
  # 定期実行のときだけ、一覧に変化があるかを先に調べる。
  # build-listing.mjs は Node の標準機能だけで動くので npm ci は不要。
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build listing
        run: node scripts/build-listing.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare with published listing
        id: diff
        run: node scripts/listing-changed.mjs

  build:
    needs: [check]
    # 定期実行以外は常に、定期実行なら一覧が変わったときだけ動かす
    if: always() && (github.event_name != 'schedule' || needs.check.outputs.changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (listing + site)
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 独自ドメイン (reframe.illusive-isc.jp) をルートで使うので BASE_PATH は付けない
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
