# サイトを build して GitHub Pages に出す。
# 起動: このリポジトリへの push / 手動 / パッケージの Release 後の repository_dispatch。
# build の中で scripts/build-listing.mjs が GitHub Release から VPM の一覧 (vpm/index.json) を作り直す。
#
# 定期実行は持たない。パッケージ側が Release のたびに repository_dispatch を送ってくる前提なので、
# 各パッケージのリポジトリに SITE_DISPATCH_TOKEN が登録されていないと一覧が更新されない。
# 送られてこなかったときは、この画面から手動実行 (Run workflow) で追いつける。
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [package-released]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 公開中のデプロイを途中で止めない
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (listing + site)
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 独自ドメイン (reframe.illusive-isc.jp) をルートで使うので BASE_PATH は付けない
      - name: Show trigger
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "::notice::${{ github.event.client_payload.repo }} ${{ github.event.client_payload.version }} のリリースで起動しました"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
